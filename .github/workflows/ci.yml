# Build, test and publish Dictum on every push and pull request; on a v* tag, also build the installer and the test
# MSIX and attach them, with the zip, to a GitHub Release. No secrets: the release uses the workflow's own token and
# the test MSIX is signed with a certificate made for that run (its private key never leaves the runner). The macOS job
# (build-mac) signs and notarises only when the owner's five MAC_* secrets exist (see the comment on that job).
# Action versions are pinned to commit SHAs (resolved 16/10/2026); Dependabot (.github/dependabot.yml) updates them.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build, test, publish
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Dictum.sln -c Release

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (dotnet msbuild src/Dictum.Windows/Dictum.Windows.csproj -getProperty:Version -nologo | Out-String).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match the project version $version (Directory.Build.props)." }

      - name: Test (ungated)
        # Tests that need a model, the desktop, the microphone or the network skip themselves unless their variable is
        # set (README, "Build from source"); none is set here.
        run: dotnet test --solution Dictum.sln -c Release --no-build

      - name: Restore the base.en speech model from the cache
        # The 148 MB file is fetched from huggingface.co once, not on every push and pull request. The key is the SHA-256
        # that scripts/download-model.ps1 and the app's catalogue pin (a test keeps the three equal), so a new pin is a
        # new key. A restored copy is trusted for nothing: download-model.ps1 hashes it again and downloads afresh on a
        # mismatch. actions/cache v6.1.0, commit resolved 17/10/2026 with the GitHub API.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/model-cache
          key: model-ggml-base.en-a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002

      - name: Publish (self-contained win-x64 zip, with the base.en speech model)
        # publish.ps1 fetches ggml-base.en.bin from huggingface.co at the commit scripts/download-model.ps1 pins, and
        # fails this job on a size or SHA-256 mismatch (Decision 16, docs/DECISIONS.md "Visual C++ runtime"). The zip,
        # and on a tag the installer and the test MSIX packed from the same dist\Dictum, carry it.
        run: ./scripts/publish.ps1

      - name: Test the published build where the Vulkan runtime cannot load
        # The launch crash of 21/10/2026 (docs/DECISIONS.md, "Launch crash without a working Vulkan driver"): a copy of
        # dist\Dictum whose ggml-vulkan-whisper.dll cannot load runs --selftest (APPDATA and LOCALAPPDATA in a temporary
        # folder) and must fall back to the CPU runtime instead of aborting with GGML_ASSERT (exit 0xC0000409).
        env:
          DICTUM_PUBLISHED_DIR: ${{ github.workspace }}\dist\Dictum
        run: dotnet test --project tests/Dictum.Tests -c Release --no-build --filter "FullyQualifiedName~Dictum.Tests.PublishedVulkanFailureTests"

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictum-win-x64-zip
          path: dist/Dictum-*-win-x64.zip
          if-no-files-found: error

      - name: Install Inno Setup 7.1.0 for this user (hash and signature checked)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Source and checks: docs/DECISIONS.md, "Packaging lane". Same version as the local build.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $expected = "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($hash -ne $expected) { throw "Inno Setup installer SHA-256 $hash is not the expected $expected." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notlike "CN=Pyrsys B.V.,*") {
            throw "Unexpected Inno Setup signature: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /NOICONS" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup did not install (exit $($setup.ExitCode))." }

      - name: Build the installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/build-installer.ps1 -NoPublish

      - name: Build the test MSIX (certificate made for this run)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/make-test-cert.ps1
          ./scripts/package-msix.ps1 -Test -NoPublish
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Copy-Item -LiteralPath packaging/test-cert/Dictum-Test.cer -Destination "dist/Dictum-$version-test.cer"
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "Dictum-$version-*" -or $_.Name -eq "Dictum-Setup-$version.exe" }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ASCII
          Get-Content dist/SHA256SUMS.txt

      - name: Upload the release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictum-release-files
          path: |
            dist/Dictum-Setup-*.exe
            dist/Dictum-*-test.msix
            dist/Dictum-*-test.cer
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-mac:
    # Dictum for macOS (beta, Apple Silicon only): build, test, publish dist/Dictum.app and its zip with scripts/publish-mac.sh.
    # macos-15 is an arm64 runner label (actions/runner-images README, "Available Images": "macOS 15 Arm64 ... arm64 ...
    # macos-15, or macos-15-xlarge", read 23/10/2026). The bundle is only Developer ID signed and notarised when the repository
    # has the five secrets below; without them (every pull request from a fork, or before the owner has made them) it is signed
    # ad-hoc, which Gatekeeper rejects, and the job still passes. The owner creates these repository secrets:
    #   MAC_SIGN_CERT_P12_BASE64   the Developer ID Application certificate and its private key, exported as .p12, base64
    #   MAC_SIGN_CERT_PASSWORD     the password set when exporting that .p12
    #   MAC_NOTARY_KEY_ID          the App Store Connect API key's key id
    #   MAC_NOTARY_ISSUER_ID       the App Store Connect issuer id
    #   MAC_NOTARY_KEY_P8_BASE64   the App Store Connect API key (.p8 file), base64
    # No step prints a secret: each reaches only the step that needs it, through that step's env, and the temporary keychain
    # and key files are deleted when the job ends (the last step).
    # The `secrets` context is not available in `jobs.<job_id>.if` or `jobs.<job_id>.steps.if`; it is available in
    # `jobs.<job_id>.env` and `steps.env`, and `env` is available in `steps.if` ("Contexts", GitHub Docs, "Context
    # availability", read 23/10/2026). So the job's env carries one boolean, and the steps test that.
    name: Build, test, publish (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_MAC_SIGNING: ${{ secrets.MAC_SIGN_CERT_P12_BASE64 != '' && secrets.MAC_SIGN_CERT_PASSWORD != '' }}
      HAS_MAC_NOTARY: ${{ secrets.MAC_NOTARY_KEY_ID != '' && secrets.MAC_NOTARY_ISSUER_ID != '' && secrets.MAC_NOTARY_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Dictum.sln -c Release

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(dotnet msbuild src/Dictum.Mac/Dictum.Mac.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match the project version $version (Directory.Build.props)." >&2; exit 1; fi

      - name: Test (ungated)
        run: dotnet test --project tests/Dictum.Tests -c Release --no-build

      - name: Restore the base.en speech model from the cache
        # Same key as the Windows job (the SHA-256 the app's catalogue pins): see that job's step.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/model-cache
          key: model-ggml-base.en-a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002

      - name: Import the signing certificate into a temporary keychain
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_SIGN_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_SIGN_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/dictum-build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          echo "DICTUM_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dictum-sign.p12"
          security import "$RUNNER_TEMP/dictum-sign.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then echo "The .p12 holds no Developer ID Application identity." >&2; exit 1; fi
          echo "DICTUM_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Store the notarytool credentials in the temporary keychain
        if: env.HAS_MAC_SIGNING == 'true' && env.HAS_MAC_NOTARY == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/dictum-notary.p8"
          xcrun notarytool store-credentials dictum-notary --key "$RUNNER_TEMP/dictum-notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$DICTUM_KEYCHAIN"
          echo "DICTUM_MAC_NOTARY_PROFILE=dictum-notary" >> "$GITHUB_ENV"

      - name: Publish (self-contained osx-arm64 app bundle and zip, with the base.en speech model)
        # scripts/publish-mac.sh signs with DICTUM_MAC_SIGN_IDENTITY and notarises with DICTUM_MAC_NOTARY_PROFILE when the
        # steps above set them; otherwise it signs ad-hoc. The model is fetched and checked by the app itself.
        run: ./scripts/publish-mac.sh

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictum-osx-arm64-zip
          path: |
            dist/Dictum-*-osx-arm64.zip
            dist/SHA256SUMS-mac.txt
          if-no-files-found: error

      - name: Delete the temporary keychain and key files
        if: always() && env.HAS_MAC_SIGNING == 'true'
        run: |
          if [ -n "${DICTUM_KEYCHAIN:-}" ]; then
            security default-keychain -s login.keychain-db || true
            security delete-keychain "$DICTUM_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/dictum-sign.p12" "$RUNNER_TEMP/dictum-notary.p8"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only for packaging/release-notes-preamble.md; the built files come from the artifacts below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Create the release with a fixed preamble and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release already exists (for example created by hand): add or replace the built files.
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # The preamble states the Visual C++ runtime requirement and the bundled model; GitHub's generated notes follow it.
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Dictum ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes-preamble.md --generate-notes --verify-tag
          fi

  private-material:
    # An after-the-fact detector, not a gate: this repository is public from the moment a push lands, so the real gate is
    # the hooks in .githooks (pre-commit, commit-msg and pre-push). Turn them on once per clone:
    # `git config core.hooksPath .githooks`. The path is read from the top of each worktree, so a worktree whose branch was
    # made before the hooks existed runs none, and git does not say so. With linked worktrees, run this once in the main
    # worktree: `git config core.hooksPath "$(git rev-parse --show-toplevel)/.githooks"`. Or bring each branch up to main
    # first. This job catches what got past them, such as a commit made with --no-verify or a clone without the hooks. It
    # fails when a tracked file is a recording or other blocked type (audio, video, subtitles, documents, archives, mail
    # exports), sits under a private/, recording(s)/ or transcript(s)/ folder, or is over 5 MiB, using the same rules as
    # the hooks (.githooks/private-guard.sh). It reads the tracked files at the tip, not history, and never the denylist
    # (that is local). Independent of the build job.
    name: Private material
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if a recording, a document, a private folder or a file over 5 MiB is tracked
        shell: sh
        run: |
          . .githooks/private-guard.sh
          pg_audit_tracked_files
