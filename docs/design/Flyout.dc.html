<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dictum tray flyout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#E6EAF2}
a{color:#8AB4FF}a:hover{color:#B7D0FF}
</style>
</helmet>
<div style="width: 420px; height: 680px; box-sizing: border-box; padding: 20px; background: #1B2130; display: flex; align-items: flex-end; justify-content: center">
  <div style="width: 380px; box-sizing: border-box; padding: 16px; background: #141C2B; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; box-shadow: 0 16px 40px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="52" rx="14" fill="#0B1220"/><path d="M14 50 L14 63 L27 50 Z" fill="#0B1220"/><rect x="18" y="24" width="6" height="16" rx="3" fill="#FFFFFF"/><rect x="29" y="15" width="6" height="34" rx="3" fill="#FFFFFF"/><rect x="40" y="21" width="6" height="22" rx="3" fill="#FFFFFF"/></svg>
      <div style="display: flex; flex-direction: column; gap: 1px; flex: 1">
        <div style="font-size: 15px; font-weight: 600">Dictum</div>
        <div style="font-size: 12px; color: #9AA6BA">medium.en · Vulkan · Qwen 1.5B · Right Ctrl</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA6BA"><span style="width: 8px; height: 8px; border-radius: 4px; background: #30A46C; display: inline-block"></span>Ready</div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer"><input type="checkbox" role="switch" checked style="width: 40px; height: 22px; accent-color: #2457E6; margin: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dictation on</span></label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; color: #9AA6BA">Mode</div>
      <div style="display: flex; background: #0B1220; border-radius: 8px; padding: 3px; gap: 3px">
        <button type="button" style="flex: 1; height: 36px; border: 0; border-radius: 6px; background: transparent; color: #C7D0E0; font: inherit; font-size: 13px; cursor: pointer">Light</button>
        <button type="button" aria-pressed="true" style="flex: 1; height: 36px; border: 0; border-radius: 6px; background: #2457E6; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Full</button>
      </div>
      <div style="font-size: 11px; color: #7E8AA0">Full: large-v3-turbo on the GPU and Qwen 1.5B. Light: base.en and the rule-based tidy.</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="speech" style="font-size: 12px; color: #9AA6BA">Speech model</label>
        <select id="speech" style="height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0B1220; color: #E6EAF2; font: inherit; font-size: 13px; padding: 0 10px"><option>large-v3-turbo</option><option>medium.en</option><option>small.en</option><option>base.en</option><option>tiny.en</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="cleanup" style="font-size: 12px; color: #9AA6BA">Clean-up</label>
        <select id="cleanup" style="height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0B1220; color: #E6EAF2; font: inherit; font-size: 13px; padding: 0 10px"><option>Qwen2.5 1.5B · local</option><option>Rule-based tidy</option><option>Qwen2.5 0.5B · local</option></select>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0B1220; border-radius: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7D0E0" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <select aria-label="Microphone" style="flex: 1; height: 30px; border: 0; background: transparent; color: #E6EAF2; font: inherit; font-size: 13px"><option>Remote Audio (default)</option><option>Headset Microphone</option></select>
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 18px" aria-hidden="true">
        <span style="width: 4px; height: 8px; background: #30A46C; border-radius: 2px; display: inline-block"></span>
        <span style="width: 4px; height: 14px; background: #30A46C; border-radius: 2px; display: inline-block"></span>
        <span style="width: 4px; height: 18px; background: #30A46C; border-radius: 2px; display: inline-block"></span>
        <span style="width: 4px; height: 10px; background: #2D3B52; border-radius: 2px; display: inline-block"></span>
        <span style="width: 4px; height: 6px; background: #2D3B52; border-radius: 2px; display: inline-block"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <label style="display: flex; align-items: center; justify-content: space-between; height: 36px; font-size: 13px; cursor: pointer"><span>Big recording indicator</span><input type="checkbox" role="switch" checked style="width: 40px; height: 22px; accent-color: #2457E6; margin: 0"></label>
      <label style="display: flex; align-items: center; justify-content: space-between; height: 36px; font-size: 13px; cursor: pointer"><span>Profanity filter</span><input type="checkbox" role="switch" style="width: 40px; height: 22px; accent-color: #2457E6; margin: 0"></label>
      <label style="display: flex; align-items: center; justify-content: space-between; height: 36px; font-size: 13px; cursor: pointer"><span>Grammar assist</span><input type="checkbox" role="switch" style="width: 40px; height: 22px; accent-color: #2457E6; margin: 0"></label>
      <label style="display: flex; align-items: center; justify-content: space-between; height: 36px; font-size: 13px; cursor: pointer"><span>Start and stop sounds</span><input type="checkbox" role="switch" checked style="width: 40px; height: 22px; accent-color: #2457E6; margin: 0"></label>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #1F2A3F; color: #E6EAF2; font: inherit; font-size: 13px; cursor: pointer">Calibrate my voice</button>
      <button type="button" style="height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #1F2A3F; color: #E6EAF2; font: inherit; font-size: 13px; cursor: pointer">Dictionary</button>
      <button type="button" style="height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #1F2A3F; color: #E6EAF2; font: inherit; font-size: 13px; cursor: pointer">Fix last dictation</button>
      <button type="button" style="height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #1F2A3F; color: #E6EAF2; font: inherit; font-size: 13px; cursor: pointer">Settings</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08)">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA6BA"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA6BA" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Nothing leaves this PC</div>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: #9AA6BA; font: inherit; font-size: 13px; cursor: pointer">Quit</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":680}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
