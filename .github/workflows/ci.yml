# Build, test and publish Dictum on every push and pull request; on a v* tag, also build the installer and the test
# MSIX and attach them, with the zip, to a GitHub Release. No secrets: the release uses the workflow's own token and
# the test MSIX is signed with a certificate made for that run (its private key never leaves the runner).
# Action versions are pinned to commit SHAs (resolved 16/10/2026); Dependabot (.github/dependabot.yml) updates them.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build, test, publish
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Dictum.sln -c Release

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (dotnet msbuild src/Dictum.Windows/Dictum.Windows.csproj -getProperty:Version -nologo | Out-String).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match the project version $version (Directory.Build.props)." }

      - name: Test (ungated)
        # Tests that need a model, the desktop, the microphone or the network skip themselves unless their variable is
        # set (README, "Build from source"); none is set here.
        run: dotnet test --solution Dictum.sln -c Release --no-build

      - name: Restore the base.en speech model from the cache
        # The 148 MB file is fetched from huggingface.co once, not on every push and pull request. The key is the SHA-256
        # that scripts/download-model.ps1 and the app's catalogue pin (a test keeps the three equal), so a new pin is a
        # new key. A restored copy is trusted for nothing: download-model.ps1 hashes it again and downloads afresh on a
        # mismatch. actions/cache v6.1.0, commit resolved 17/10/2026 with the GitHub API.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/model-cache
          key: model-ggml-base.en-a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002

      - name: Publish (self-contained win-x64 zip, with the base.en speech model)
        # publish.ps1 fetches ggml-base.en.bin from huggingface.co at the commit scripts/download-model.ps1 pins, and
        # fails this job on a size or SHA-256 mismatch (Decision 16, docs/DECISIONS.md "Visual C++ runtime"). The zip,
        # and on a tag the installer and the test MSIX packed from the same dist\Dictum, carry it.
        run: ./scripts/publish.ps1

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictum-win-x64-zip
          path: dist/Dictum-*-win-x64.zip
          if-no-files-found: error

      - name: Install Inno Setup 7.1.0 for this user (hash and signature checked)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Source and checks: docs/DECISIONS.md, "Packaging lane". Same version as the local build.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $expected = "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($hash -ne $expected) { throw "Inno Setup installer SHA-256 $hash is not the expected $expected." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notlike "CN=Pyrsys B.V.,*") {
            throw "Unexpected Inno Setup signature: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /NOICONS" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup did not install (exit $($setup.ExitCode))." }

      - name: Build the installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/build-installer.ps1 -NoPublish

      - name: Build the test MSIX (certificate made for this run)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/make-test-cert.ps1
          ./scripts/package-msix.ps1 -Test -NoPublish
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Copy-Item -LiteralPath packaging/test-cert/Dictum-Test.cer -Destination "dist/Dictum-$version-test.cer"
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "Dictum-$version-*" -or $_.Name -eq "Dictum-Setup-$version.exe" }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ASCII
          Get-Content dist/SHA256SUMS.txt

      - name: Upload the release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictum-release-files
          path: |
            dist/Dictum-Setup-*.exe
            dist/Dictum-*-test.msix
            dist/Dictum-*-test.cer
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only for packaging/release-notes-preamble.md; the built files come from the artifacts below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Create the release with a fixed preamble and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release already exists (for example created by hand): add or replace the built files.
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # The preamble states the Visual C++ runtime requirement and the bundled model; GitHub's generated notes follow it.
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Dictum ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes-preamble.md --generate-notes --verify-tag
          fi

  private-material:
    # An after-the-fact detector, not a gate: this repository is public from the moment a push lands, so the real gate is
    # the hooks in .githooks (pre-commit, commit-msg and pre-push). Turn them on once per clone:
    # `git config core.hooksPath .githooks`. The path is read from the top of each worktree, so a worktree whose branch was
    # made before the hooks existed runs none, and git does not say so. With linked worktrees, run this once in the main
    # worktree: `git config core.hooksPath "$(git rev-parse --show-toplevel)/.githooks"`. Or bring each branch up to main
    # first. This job catches what got past them, such as a commit made with --no-verify or a clone without the hooks. It
    # fails when a tracked file is a recording or other blocked type (audio, video, subtitles, documents, archives, mail
    # exports), sits under a private/, recording(s)/ or transcript(s)/ folder, or is over 5 MiB, using the same rules as
    # the hooks (.githooks/private-guard.sh). It reads the tracked files at the tip, not history, and never the denylist
    # (that is local). Independent of the build job.
    name: Private material
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if a recording, a document, a private folder or a file over 5 MiB is tracked
        shell: sh
        run: |
          . .githooks/private-guard.sh
          pg_audit_tracked_files
