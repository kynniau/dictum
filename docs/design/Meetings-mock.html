<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictum Meetings mock</title>
<!--
  Clickable UX mock for the proposed Meetings mode (docs/MEETINGS-BRIEF.md, DRAFT 04/11/2026).
  Self-contained: no external scripts, fonts or images. Nothing is recorded, no microphone is opened,
  no file is read or written. All names, firms, amounts and files are fictional sample content.
-->
<style>
:root{
  --win:#F4F6FA;--surf:#FFFFFF;--line:#E2E8F0;--ctlb:#CBD5E1;--text:#0F172A;--text2:#334155;--muted:#64748B;
  --accent:#2457E6;--accentH:#1A43B8;--rec:#E5484D;--work:#F5A524;--done:#30A46C;--ink:#0B1220;
  --dsurf:#141C2B;--dtext:#E6EAF2;--dtext2:#C7D0E0;--dmuted:#9AA6BA;--dfaint:#7E8AA0;--dbtn:#1F2A3F;
  --dline:rgba(255,255,255,.08);--dctl:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:20px;color:var(--text);background:#1B2436}
.display{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dark :focus-visible{outline-color:#8AB4FF}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* desktop */
#desk{position:fixed;left:0;right:0;top:0;bottom:56px;display:flex;flex-direction:column;background:#1B2436}
#stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px;gap:24px}
#stage.corner{align-items:flex-end;justify-content:flex-end}
#taskbar{height:44px;flex:none;background:rgba(20,28,43,.96);border-top:1px solid var(--dline);display:flex;align-items:center;justify-content:center;gap:18px;position:relative;color:var(--dtext2);font-size:12px}
.tb-app{width:22px;height:22px;border-radius:4px;background:#334155;display:inline-block}
.tb-app.first{background:var(--accent)}
.tb-tray{position:absolute;right:10px;top:0;bottom:0;display:flex;align-items:center;gap:8px}
.trayicon{width:36px;height:36px;border:0;border-radius:6px;background:transparent;display:grid;place-items:center;cursor:pointer}
.trayicon:hover{background:rgba(255,255,255,.08)}
.deskhint{color:var(--dtext2);font-size:13px;background:rgba(11,18,32,.85);border:1px solid var(--dline);border-radius:12px;padding:12px 16px;max-width:360px}

/* mock chrome: the scene strip is NOT app UI */
#strip{position:fixed;left:0;right:0;bottom:0;height:56px;background:#FFFFFF;border-top:2px dashed #94A3B8;display:flex;align-items:center;gap:6px;padding:0 12px;overflow-x:auto;z-index:80}
#strip .lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-right:4px;white-space:nowrap}
#strip button{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--ctlb);background:#fff;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
#strip button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#strip .sep{flex:1;min-width:8px}

/* buttons, as Theme/Controls.axaml: primary, secondary, danger, quiet; radius 8, height 36 */
.btn{height:36px;padding:0 14px;border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border:1px solid transparent;color:var(--text);background:transparent}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accentH)}
.btn.secondary{background:#fff;border-color:var(--ctlb)}
.btn.secondary:hover{background:#F8FAFC}
.btn.danger{background:var(--rec);color:#fff;font-weight:600}
.btn.danger:hover{background:#C83A3F}
.btn.quiet{color:var(--muted)}
.btn.quiet:hover{color:var(--text)}
.btn.link{color:var(--accent);padding:0 2px;height:auto;min-height:24px}
.btn.big{height:44px;font-size:14px;padding:0 18px}
.dark .btn.secondary{background:var(--dbtn);border-color:var(--dctl);color:var(--dtext)}
.dark .btn.secondary:hover{background:#26334C}
.dark .btn.quiet{color:var(--dmuted)}
.dark .btn.quiet:hover{color:var(--dtext)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--rec);display:inline-block;flex:none}
.dot.white{background:#fff}
.dot.amber{background:var(--work)}
.breathe{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.fade{animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.breathe,.fade{animation:none}}

/* windows, as Calibrate.dc.html */
.win{background:var(--win);border:1px solid #D5DCE6;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;max-width:100%;max-height:100%}
.titlebar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;background:#fff;border-bottom:1px solid var(--line)}
.titlebar .t{font-size:13px;font-weight:600}
.titlebar .sp{flex:1}
.footbar{min-height:56px;flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 20px;background:#fff;border-top:1px solid var(--line)}
.footbar .sp{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.overline{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.caption{font-size:12px;line-height:17px;color:var(--muted)}
.body2{font-size:13px;line-height:19px;color:var(--text2)}
.h1{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.3px;margin:0}
.h2{font-size:16px;line-height:22px;font-weight:600;margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.tabnum{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.share{background:#E8EEFD;color:#1A43B8}
.badge.zoom{background:#EEF1F5;color:#334155}
.badge.video{background:#EEF1F5;color:#334155}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#334155;background:#E9EDF3;border-radius:4px;padding:1px 6px;vertical-align:middle}

/* PLACEHOLDER and PROPOSED markers: copy that is not approved */
.ph{border:1.5px dashed #B7791F;background:#FFF8E6;border-radius:8px;padding:10px 12px}
.tagph{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;color:#7A4B00;background:#FDE7B0;border-radius:4px;padding:1px 6px;vertical-align:middle;text-transform:uppercase}
.dark .tagph{color:#3B2600;background:#F5C76A}
.ref{display:none;font-size:10px;font-weight:700;color:#5B21B6;background:#EDE9FE;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:4px}
body.refs .ref{display:inline-block}

/* inputs */
.input{height:36px;border-radius:8px;border:1px solid var(--ctlb);background:#fff;color:var(--text);padding:0 10px;font-size:13px}
select.input{padding:0 8px}
.switch{width:40px;height:22px;accent-color:var(--accent);margin:0;cursor:pointer}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:13px;font-weight:600;margin-bottom:6px}
.radio{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13px;cursor:pointer}
.radio input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}

/* flyout, as Flyout.dc.html */
.flyout{width:380px;max-width:100%;padding:16px;background:var(--dsurf);color:var(--dtext);border:1px solid var(--dline);border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px}
.flyout .muted{color:var(--dmuted)}
.flyout select{height:36px;border-radius:8px;border:1px solid var(--dctl);background:#0B1220;color:var(--dtext);font-size:13px;padding:0 10px;width:100%}
.flyout .seg2{display:flex;background:#0B1220;border-radius:8px;padding:3px;gap:3px}
.flyout .seg2 button{flex:1;height:36px;border:0;border-radius:6px;background:transparent;color:var(--dtext2);font-size:13px;cursor:pointer}
.flyout .seg2 button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.flyout .tog{display:flex;align-items:center;justify-content:space-between;height:36px;font-size:13px;cursor:pointer}
.flyout .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.flyout .grid2 .btn{height:40px;width:100%}
.flyout .meetbox{display:flex;flex-direction:column;gap:8px;padding:10px;background:#0B1220;border-radius:8px}
.flyout .meetbox .btn{height:40px;width:100%}
.flyout .foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--dline)}

/* toast (Dictum floating surface) */
.ztoast{width:380px;max-width:100%;padding:14px 16px;background:var(--dsurf);color:var(--dtext);border:1px solid var(--dline);border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px}
#toasts{position:fixed;right:16px;bottom:112px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:calc(100vw - 32px)}
.toast{width:360px;max-width:100%;padding:12px 14px;background:var(--dsurf);color:var(--dtext);border:1px solid var(--dline);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:13px;line-height:18px;display:flex;flex-direction:column;gap:8px}

/* illustration of a call window */
.callwin{width:520px;max-width:100%;height:330px;background:#0F1626;border:1px solid var(--dline);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;color:var(--dtext2);font-size:12px}
.callwin .cbar{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--dline)}
.callwin .tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.callwin .tile{background:#1F2A3F;border-radius:8px;display:grid;place-items:center;color:var(--dmuted)}

/* recording window */
.meterrow{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px}
.meter{display:flex;gap:3px;height:18px;align-items:stretch}
.seg{flex:1;max-width:12px;border-radius:2px;background:#CBD5E1}
.seg.on{background:var(--done)}
.seg.hot{background:var(--work)}
.tlist{flex:1;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.trow{display:grid;grid-template-columns:56px 64px 1fr;gap:8px;align-items:baseline;padding:5px 4px;border-radius:6px;font-size:13px;line-height:19px}
.trow.sys{grid-template-columns:56px 1fr;color:var(--muted);font-size:12px}
.tt{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
button.tt{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:var(--accent)}
button.tt:hover{text-decoration:underline}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;line-height:18px;justify-self:start}
.tag.you{background:#E8EEFD;color:#1A43B8}
.tag.oth{background:#EEF1F5;color:#334155}
.systext{font-style:italic}

/* meeting window */
.mhead{display:flex;align-items:flex-start;gap:16px;padding:16px 20px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.titlein{width:100%;border:1px solid transparent;border-radius:8px;background:transparent;font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.3px;padding:2px 6px;margin-left:-7px;color:var(--text)}
.titlein:hover{border-color:var(--line)}
.titlein:focus-visible{border-color:var(--ctlb);background:#fff}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.mbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:16px 20px}
.col{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbar{flex:1;min-width:80px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar>div{height:100%;background:var(--accent)}
.sumsec{display:flex;flex-direction:column;gap:2px}
.sumsec h4{margin:0;font-size:13px;font-weight:600}
.sumsec p{margin:0;font-size:13px;line-height:19px;color:var(--text2)}
.sumsec p.empty{color:var(--muted);font-style:italic}
.owner{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.owner h5{margin:0;font-size:12px;font-weight:600;color:var(--text2)}
.owner ul{margin:0;padding-left:18px;font-size:13px;line-height:19px;color:var(--text2)}
.honest{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:var(--win);border:1px solid var(--line);border-radius:8px;font-size:12px;line-height:17px;color:var(--text2)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 20px 0;padding:10px 14px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;font-size:13px}
.menu{position:absolute;right:0;top:40px;z-index:20;width:300px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.menu button{height:36px;text-align:left;border:0;background:transparent;border-radius:6px;padding:0 10px;font-size:13px;cursor:pointer;color:var(--text)}
.menu button:hover{background:var(--win)}
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);padding:12px;background:var(--win);border-radius:8px}
.spin{width:16px;height:16px;flex:none}

/* list */
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mrow{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--text)}
.mrow:hover{border-color:var(--ctlb)}
.mrow .mt{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mm{font-size:12px;color:var(--muted);grid-column:1}
.mrow .bd{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mrow .snip{grid-column:1 / -1;font-size:12px;color:var(--text2)}

/* settings */
.snav{width:180px;flex:none;background:#fff;border-right:1px solid var(--line);padding:16px 8px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.snav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.snav button{width:100%;height:34px;text-align:left;border:0;background:transparent;border-radius:6px;padding:0 10px;font-size:13px;cursor:pointer;color:var(--text)}
.snav button:hover{background:var(--win)}
.snav button[aria-current="page"]{background:#E8EEFD;color:#1A43B8;font-weight:600}
.spage{flex:1;overflow:auto;padding:24px 28px}
.spage .inner{max-width:620px;display:flex;flex-direction:column;gap:14px}
.member{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.avatar{width:24px;height:24px;border-radius:12px;background:#E9EDF3;color:#334155;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}

/* dialogs */
#layer .scrim{position:fixed;left:0;right:0;top:0;bottom:56px;background:rgba(11,18,32,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.dialog{width:540px}
.dialog .dbody{padding:18px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
pre.md{margin:0;padding:12px;background:var(--win);border:1px solid var(--line);border-radius:8px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;line-height:18px;white-space:pre-wrap}
textarea.input{height:140px;padding:8px 10px;resize:vertical;width:100%}
.filebtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:var(--text)}
.filebtn:hover{border-color:var(--ctlb)}

@media (max-width:900px){
  .mbody{grid-template-columns:1fr;overflow:auto}
  .col{overflow:visible}
  .snav{width:140px}
}
@media (max-width:640px){
  .snav{display:none}
  #stage{padding:12px}
}
</style>
</head>
<body>
<noscript><p style="color:#fff;padding:24px">This mock needs JavaScript to be clickable. It makes no network requests.</p></noscript>
<div id="desk">
  <main id="stage" aria-label="Mock desktop"></main>
  <div id="taskbar" class="dark" aria-label="Taskbar (illustration)">
    <span class="tb-app first" aria-hidden="true"></span><span class="tb-app" aria-hidden="true"></span><span class="tb-app" aria-hidden="true"></span><span class="tb-app" aria-hidden="true"></span>
    <div class="tb-tray"><button type="button" class="trayicon" id="trayBtn" data-act="tray"></button><span id="tbClock" class="tabnum"></span></div>
  </div>
</div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<nav id="strip" aria-label="Mock scenes (not part of the app)"></nav>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
const fmtClock = d => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
const fmtHM = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const fmtT = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? h + ':' + pad(m) + ':' + pad(x) : m + ':' + pad(x); };
const fmtDur = s => s < 60 ? Math.max(1, Math.round(s)) + ' sec' : s < 3600 ? Math.round(s / 60) + ' min' : Math.floor(s / 3600) + ' h ' + pad(Math.round(s % 3600 / 60)) + ' min';
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const ref = s => '<span class="ref">Brief ' + esc(s) + '</span>';
const PH = '<span class="tagph">Placeholder · counsel\'s words to come</span>';
const PROP = '<span class="tagph">Proposed wording, not approved</span>';

const MARK = s => '<svg aria-hidden="true" width="' + s + '" height="' + s + '" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="52" rx="14" fill="#0B1220"/><path d="M14 50 L14 63 L27 50 Z" fill="#0B1220"/><rect x="18" y="24" width="6" height="16" rx="3" fill="#FFFFFF"/><rect x="29" y="15" width="6" height="34" rx="3" fill="#FFFFFF"/><rect x="40" y="21" width="6" height="22" rx="3" fill="#FFFFFF"/></svg>';
const TRAY_IDLE = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="5" width="3" height="6" rx="1.5" fill="#FFFFFF"/><rect x="6.5" y="2" width="3" height="12" rx="1.5" fill="#FFFFFF"/><rect x="11" y="4" width="3" height="8" rx="1.5" fill="#FFFFFF"/></svg>';
const TRAY_REC = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#E5484D"/><rect x="3" y="5.5" width="2.5" height="5" rx="1.25" fill="#FFFFFF"/><rect x="6.75" y="3.5" width="2.5" height="9" rx="1.25" fill="#FFFFFF"/><rect x="10.5" y="5" width="2.5" height="6" rx="1.25" fill="#FFFFFF"/></svg>';
const LOCK = c => '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
const SPIN = '<svg class="spin" aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="rgba(245,165,36,0.35)" stroke-width="2.5"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="#F5A524" stroke-width="2.5" stroke-linecap="round"/></svg>';

function buildMeeting(id, key, o) {
  const c = CONTENT[key];
  const lines = c.lines.map(l => ({ t: l[2], ch: l[0], text: l[1] }));
  (c.marks || []).forEach(t => lines.push({ t: t, sys: 'mark' }));
  lines.sort((a, b) => a.t - b.t);
  return Object.assign({ id: id, content: key, title: c.title, date: fmtDate(new Date()), dur: c.dur, size: c.size, shared: false,
    source: null, file: null, video: false, consent: null, tpl: c.defTpl, lines: lines }, o || {});
}

function titlebar(title, extra) {
  return '<div class="titlebar">' + MARK(20) + '<span class="t">' + esc(title) + '</span><span class="sp"></span>' + (extra || '') +
    '<button type="button" class="btn quiet" aria-label="Close window" data-act="closeWin" style="width:32px;padding:0;font-size:16px">×</button></div>';
}
function badges(m) {
  let b = '';
  if (m.shared) b += '<span class="badge share">Shared with team</span>';
  if (m.source === 'zoom') b += '<span class="badge zoom">Imported from Zoom</span>';
  if (m.source === 'file') b += '<span class="badge zoom">Imported</span>';
  if (m.video) b += '<span class="badge video">Video kept</span>';
  return b;
}
function sysText(l) {
  if (l.sys === 'mark') return '◆ Marked moment';
  if (l.sys === 'join') return 'Someone joined. Reminder shown again; acknowledged at ' + esc(l.ack) + '.';
  if (l.sys === 'pause') return 'Paused. Nothing recorded until resumed.';
  if (l.sys === 'resume') return 'Resumed.';
  return '';
}
function rowsHTML(lines, clickable) {
  if (!lines.length) return '<div class="caption" style="padding:8px 4px">Waiting for the first words…</div>';
  return lines.map(l => {
    if (l.sys) return '<div class="trow sys"><span class="tt">' + fmtT(l.t) + '</span><span class="systext">' + sysText(l) + '</span></div>';
    const tt = clickable
      ? '<button type="button" class="tt" data-act="seek" data-arg="' + l.t + '" aria-label="Play from ' + fmtT(l.t) + '">' + fmtT(l.t) + '</button>'
      : '<span class="tt">' + fmtT(l.t) + '</span>';
    return '<div class="trow">' + tt + '<span class="tag ' + (l.ch === 'You' ? 'you' : 'oth') + '">' + l.ch + '</span><span>' + esc(l.text) + '</span></div>';
  }).join('');
}
function meterHTML(id, label) {
  let segs = '';
  for (let i = 0; i < 16; i++) segs += '<span class="seg"></span>';
  return '<div class="meter" id="' + id + '" role="meter" aria-label="' + label + ' sound level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' + segs + '</div>';
}
function keepWords() {
  return S.keepAudio === 'keep' ? 'until you delete it'

}

};

function summaryHTML(m) {
  const proc = S.proc && S.proc.id === m.id ? S.proc.step : null;
  const tplSel = '<label for="tplSel" class="sr">Summary template</label><select id="tplSel" class="input" data-change="tpl">' +
    Object.keys(TPL).map(k => '<option value="' + k + '"' + (m.tpl === k ? ' selected' : '') + '>' + TPL[k].name + '</option>').join('') + '</select>';
  const head = '<div class="row"><span class="overline" style="flex:1">Summary</span>' + tplSel +
    '<button type="button" class="btn secondary" id="regenBtn" data-act="regen"' + (proc ? ' disabled' : '') + '>Regenerate</button></div>';
  if (proc === 'import' || proc === 'transcript') return head + '<div class="status">' + SPIN + 'The summary starts when the transcript is finished.</div>';
  if (proc === 'summary') return head + '<div class="status" role="status">' + SPIN + (S.engine === 'cloud' ? 'Sending the transcript text to your own key\'s service and writing the summary…' : S.engine === 'ollama' ? 'Ollama on this PC is writing the summary…' : 'Writing the summary on this computer…') + '</div>';
  const c = CONTENT[m.content];
  const spoken = m.lines.filter(l => l.ch).length;
  const data = (c.sum[m.tpl]) || {};
  const ok = it => it.need < spoken;
  let secs = TPL[m.tpl].sections.map(sec => {
    if (sec === 'Recording') {
      return '<div class="sumsec"><h4>Recording</h4><p>' + consentLine(m) + '</p><p class="caption">From the meeting record, not written by the model.</p></div>';
    }
    const txt = (data[sec] || []).filter(ok).map(i => esc(i.t)).join(' ');
    return '<div class="sumsec"><h4>' + esc(sec) + '</h4>' + (txt ? '<p>' + txt + '</p>' : '<p class="empty">Nothing in the transcript for this section.</p>') + '</div>';
  }).join('');
  const owners = Object.keys(c.actions).map(o => {
    const items = c.actions[o].filter(ok);
    return items.length ? '<div class="owner"><h5>' + esc(o) + '</h5><ul>' + items.map(i => '<li>' + esc(i.t) + '</li>').join('') + '</ul></div>' : '';
  }).join('');
  const eng = m.engine || 'local'; // the engine that wrote this meeting's summary, not today's setting
  const caption = eng === 'local'
    ? 'Summary generated locally by a small model. Check it against the transcript before relying on it.'
    : eng === 'ollama'
      ? 'Summary generated by the model Ollama runs on this PC. Check it against the transcript before relying on it. ' + PROP
      : 'Summary generated through your own Claude or OpenAI key: the transcript text left this PC for that service. Check it against the transcript before relying on it. ' + PROP;
  return head + '<div class="caption">Made with: ' + ENGINE[eng] + ' · template: ' + TPL[m.tpl].name + '</div>' + secs +
    '<div class="sumsec"><h4>Action items</h4>' + (owners || '<p class="empty">No action items found.</p>') + '</div>' +
    '<div class="honest" role="note">' + INFO + '<span>' + caption + ref('D5') + '</span></div>';
}
function consentLine(m) {
  const k = m.consent || {};
  if (k.imported) return 'Imported by you on ' + esc(k.imported) + '. How they agreed: ' + esc(k.how) + '.';
  let s = 'Agreement reminder acknowledged ' + esc(k.ack || '') + '. How they agreed: ' + esc(k.how || '') + '.';
  if (k.joins && k.joins.length) s += ' Someone joined at ' + k.joins.map(fmtT).join(', ') + '; reminder shown again.';
  return s;
}

let tickT = null, meterT = null;

function tick() {

    r.elapsed++;
    const src = CONTENT.client.lines;
    if (r.idx < src.length && r.elapsed >= 3 + 3 * r.idx) {
      r.lines.push({ t: Math.max(0, r.elapsed - 2), ch: src[r.idx][0], text: src[r.idx][1] });
      r.idx++;
      const box = $('#tlist');
      if (box) {
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
        box.innerHTML = rowsHTML(r.lines, false);
        if (atBottom) box.scrollTop = box.scrollHeight;
      }
    }
  }

}
function setMeter(id, lv) {

});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'search') { S.search = e.target.value; render(); }
  else if (k === 'title') { const m = cur(); if (m) m.title = e.target.value; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.exportOpen) { S.exportOpen = false; S.focusNext = '#exportBtn'; render(); e.preventDefault(); return; }
    if (S.dialog) { if (S.dialog === 'cloud') ACT.cloudNo(); else closeDialog(); e.preventDefault(); return; }
    if (S.scene === 'zoom') { ACT.zoomNo(); e.preventDefault(); return; }
    if (S.scene === 'consent') { ACT.consentCancel(); e.preventDefault(); return; }
    if (S.scene === 'tray') { go('desk'); $('#trayBtn').focus(); e.preventDefault(); return; }
    return;
  }
  if (e.key === 'Tab' && S.dialog) {
    const f = Array.prototype.filter.call(document.querySelectorAll('.dialog button, .dialog input, .dialog select, .dialog textarea'), x => !x.disabled);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!e.target.closest('.dialog')) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
function clock() { $('#tbClock').textContent = fmtHM(new Date()); }
clock(); setInterval(clock, 15000);
render();
</script>
</body>
</html>
