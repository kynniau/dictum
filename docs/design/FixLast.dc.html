<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dictum fix last dictation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#0F172A}
a{color:#2457E6}a:hover{color:#1A43B8}
</style>
</helmet>
<div style="width: 560px; height: 480px; box-sizing: border-box; background: #F4F6FA; border: 1px solid #D5DCE6; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="52" rx="14" fill="#0B1220"/><path d="M14 50 L14 63 L27 50 Z" fill="#0B1220"/><rect x="18" y="24" width="6" height="16" rx="3" fill="#FFFFFF"/><rect x="29" y="15" width="6" height="34" rx="3" fill="#FFFFFF"/><rect x="40" y="21" width="6" height="22" rx="3" fill="#FFFFFF"/></svg>
    <span style="font-size: 13px; font-weight: 600">Fix last dictation</span>
    <span style="font-size: 12px; color: #64748B">pasted 40 s ago into Outlook</span>
    <span style="flex: 1"></span>
    <button type="button" aria-label="Close" style="width: 32px; height: 32px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #64748B; cursor: pointer">×</button>
  </div>

  <div style="flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <label for="fix" style="font-size: 12px; color: #64748B">Edit the text, then save the words you changed as corrections</label>
    <textarea id="fix" style="flex: 1; min-height: 120px; resize: none; padding: 12px 14px; border: 1px solid #CBD5E1; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; line-height: 21px; color: #0F172A">Hi Priya, thanks for sending the settlement figures through. Kynni will have the loan documents with the lender by Friday the 14th.</textarea>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #64748B; text-transform: uppercase; letter-spacing: 1px">Changes found</div>
      <label style="display: flex; align-items: center; gap: 8px; height: 32px; font-size: 13px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #2457E6; margin: 0">Add correction: <span style="font-weight: 600">Kinny → Kynni</span></label>
      <label style="display: flex; align-items: center; gap: 8px; height: 32px; font-size: 13px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #2457E6; margin: 0">Add correction: <span style="font-weight: 600">fourteen → 14th</span><span style="font-size: 11px; color: #64748B">(probably a one-off, leave unticked)</span></label>
    </div>
  </div>

  <div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #FFFFFF; border-top: 1px solid #E2E8F0">
    <button type="button" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: inherit; font-size: 13px; cursor: pointer">Copy</button>
    <button type="button" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: inherit; font-size: 13px; cursor: pointer">Paste fix</button>
    <span style="flex: 1"></span>
    <button type="button" style="height: 36px; padding: 0 16px; border-radius: 8px; border: 0; background: #2457E6; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Save corrections</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
